# Builds every plugin folder and publishes them to GitHub Pages:
#   https://<owner>.github.io/<repo>/<plugin>/
name: Deploy plugins to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The build job runs npm ci on third-party packages, so it only gets read
# access. Only the deploy job can publish to Pages.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build plugins
        env:
          CI: false
        run: |
          mkdir -p _site
          for dir in */; do
            plugin="${dir%/}"
            [ -f "$plugin/package.json" ] || continue
            echo "::group::$plugin"
            npm ci --prefix "$plugin" --no-audit --no-fund
            # Date layout depends on the viewer's time zone: test west, east and UTC.
            if grep -q '"test":' "$plugin/package.json"; then
              for tz in America/Los_Angeles America/New_York UTC Europe/London Asia/Tokyo Australia/Sydney Pacific/Kiritimati; do
                echo "tests in $tz"
                TZ=$tz CI=true npm test --prefix "$plugin" -- --watchAll=false --passWithNoTests
              done
            fi
            npm run build --prefix "$plugin"
            cp -r "$plugin/build" "_site/$plugin"
            echo "::endgroup::"
          done
          cp README.md _site/README.md
          {
            echo '<!doctype html><meta charset="utf-8"><title>Sigma plugins</title><h1>Sigma plugins</h1><ul>'
            for p in _site/*/; do p="$(basename "$p")"; echo "<li><a href=\"$p/\">$p</a></li>"; done
            echo '</ul>'
          } > _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
